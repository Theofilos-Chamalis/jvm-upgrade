# Catalog "comment" with quotes
[versions]
kotlin = "2.0.0" # trailing comment
coroutines = "1.8.1"
okhttp = { strictly = "[4.0,5.0[", prefer = "4.12.0" }
compose-bom = "2024.06.00"
dynamic = "1.+"

[libraries]
coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
gson = "com.google.code.gson:gson:2.11.0"
junit = { module = "junit:junit", version = "4.13.2" }
guava = { module = "com.google.guava:guava", version = { require = "33.2.1-jre" } }
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
compose-ui = { module = "androidx.compose.ui:ui" }
managed = "androidx.compose.material3:material3"
anything = { module = "com.example:anything", version.ref = "dynamic" }
multiline = {
  module = "com.example:multi",
  version = "0.9.0"
}

[bundles]
coroutines = [
  "coroutines-core",
  "coroutines-android",
]

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
ksp = "com.google.devtools.ksp:2.0.0-1.0.22"
detekt = { id = "io.gitlab.arturbosch.detekt", version = "1.23.6" }
